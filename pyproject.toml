[project]
name = "corn-agent"
version = "0.1.0"
description = "AI Agent 練習與實驗紀錄（本地端模型 + OpenAI SDK / LangGraph）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "openai>=1.70.0",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
